<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Fields</title>
<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f5fb; color: #1e1b2e; display: flex; flex-wrap: wrap; min-height: 100vh; }
  aside { flex: 1 1 240px; max-width: 320px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  main { flex: 3 1 360px; padding: 20px; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: 760px; aspect-ratio: 4 / 3; border-radius: 16px; box-shadow: 0 10px 30px rgba(30,27,46,.15); background: #fff; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; font-size: 14px; color: #5b5770; line-height: 1.5; }
  label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
  input[type=range] { width: 100%; accent-color: #6d28d9; }
  select, input[type=number] { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid #d6d3e4; background: #fff; }
  .row { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .primary { background: #6d28d9; color: #fff; }
  .secondary { background: #ebe7f7; color: #3b2d6b; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Flow Fields</h1>
    <p>Lines follow invisible currents. Change the settings, or press “Surprise me”.</p>
  </div>
  <label>Seed (the picture's ID)
    <input id="seed" type="number" min="1" max="999999" value="2026">
  </label>
  <label>Colours
    <select id="palette">
      <option value="aurora">Aurora</option>
      <option value="sunset">Sunset</option>
      <option value="ocean">Ocean</option>
      <option value="ink">Ink</option>
    </select>
  </label>
  <label>Number of lines <span id="countOut"></span>
    <input id="count" type="range" min="200" max="4000" step="100" value="1800">
  </label>
  <label>Line length <span id="lenOut"></span>
    <input id="len" type="range" min="10" max="200" step="5" value="80">
  </label>
  <label>Swirliness <span id="swirlOut"></span>
    <input id="swirl" type="range" min="1" max="10" step="1" value="4">
  </label>
  <div class="row">
    <button class="primary" id="surprise">Surprise me</button>
    <button class="secondary" id="save">Save PNG</button>
  </div>
</aside>
<main><canvas id="c" width="1600" height="1200" aria-label="Generated artwork"></canvas></main>
<script>
(() => {
  const PALETTES = {
    aurora: { bg: "#0f1026", colors: ["#7c3aed", "#22d3ee", "#a3e635", "#f0abfc"] },
    sunset: { bg: "#fff7ed", colors: ["#f97316", "#e11d48", "#facc15", "#7c2d12"] },
    ocean: { bg: "#ecfeff", colors: ["#0e7490", "#0369a1", "#14b8a6", "#1e3a8a"] },
    ink: { bg: "#fafaf9", colors: ["#1c1917", "#44403c", "#78716c", "#b91c1c"] },
  };
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d");

  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function makeNoise(rand) {
    const size = 256, perm = new Uint8Array(size * 2), grad = [];
    for (let i = 0; i < size; i++) { perm[i] = i; const a = rand() * Math.PI * 2; grad.push([Math.cos(a), Math.sin(a)]); }
    for (let i = size - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < size; i++) perm[i + size] = perm[i];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const dot = (ix, iy, x, y) => { const g = grad[perm[(perm[ix & 255] + iy) & 511] & 255]; return g[0] * (x - ix) + g[1] * (y - iy); };
    return (x, y) => {
      const x0 = Math.floor(x), y0 = Math.floor(y), sx = fade(x - x0), sy = fade(y - y0);
      const a = dot(x0, y0, x, y) + sx * (dot(x0 + 1, y0, x, y) - dot(x0, y0, x, y));
      const b = dot(x0, y0 + 1, x, y) + sx * (dot(x0 + 1, y0 + 1, x, y) - dot(x0, y0 + 1, x, y));
      return a + sy * (b - a);
    };
  }

  function draw() {
    const seed = Math.max(1, Math.min(999999, parseInt($("seed").value, 10) || 1));
    const pal = PALETTES[$("palette").value] || PALETTES.aurora;
    const count = +$("count").value, len = +$("len").value, swirl = +$("swirl").value;
    $("countOut").textContent = count; $("lenOut").textContent = len; $("swirlOut").textContent = swirl;
    const rand = mulberry32(seed), noise = makeNoise(rand);
    const W = canvas.width, H = canvas.height, scale = 0.0009 * swirl;
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";
    for (let i = 0; i < count; i++) {
      let x = rand() * W, y = rand() * H;
      ctx.strokeStyle = pal.colors[Math.floor(rand() * pal.colors.length)];
      ctx.globalAlpha = 0.35 + rand() * 0.5;
      ctx.lineWidth = 0.6 + rand() * 2.2;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < len; s++) {
        const angle = noise(x * scale, y * scale) * Math.PI * 4;
        x += Math.cos(angle) * 3; y += Math.sin(angle) * 3;
        if (x < 0 || x > W || y < 0 || y > H) break;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    document.body.dataset.rendered = String(seed);
  }

  let pending = 0;
  const schedule = () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(draw); };
  ["seed", "palette", "count", "len", "swirl"].forEach((id) => $(id).addEventListener("input", schedule));
  $("surprise").addEventListener("click", () => {
    $("seed").value = Math.floor(Math.random() * 999999) + 1;
    const keys = Object.keys(PALETTES); $("palette").value = keys[Math.floor(Math.random() * keys.length)];
    $("swirl").value = Math.floor(Math.random() * 10) + 1;
    schedule();
  });
  $("save").addEventListener("click", () => {
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "flow-field-" + $("seed").value + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  });
  draw();
})();
</script>
</body>
</html>
