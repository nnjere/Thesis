<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Chart</title>
<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f7fb; color: #0f2234; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } .card { order: -1; } }
  h1 { margin: 0; font-size: 22px; } p { margin: 4px 0 12px; color: #4b6075; font-size: 14px; line-height: 1.5; }
  textarea { width: 100%; height: 240px; font: 14px/1.5 ui-monospace, Menlo, monospace; border-radius: 12px; border: 1px solid #c9d8e6; padding: 10px; resize: vertical; }
  label { font-size: 13px; font-weight: 600; display: block; margin: 12px 0 6px; }
  input[type=text] { width: 100%; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid #c9d8e6; }
  .seg { display: inline-flex; background: #dde9f3; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: #31506b; }
  .seg button[aria-pressed=true] { background: #fff; color: #0f2234; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 8px 24px rgba(15,34,52,.08); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .primary { background: #0369a1; color: #fff; } .secondary { background: #dde9f3; color: #0f2234; }
  .msg { font-size: 13px; color: #b45309; min-height: 1.2em; margin-top: 8px; }
  svg text { font-family: system-ui, sans-serif; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Quick Chart</h1>
    <p>Paste two columns from a spreadsheet: a label, then a number. One row per line.</p>
    <textarea id="data" aria-label="Your data" spellcheck="false">Month	Visitors
January	1200
February	1350
March	1720
April	1610
May	2040
June	2380</textarea>
    <label for="title">Chart title</label>
    <input type="text" id="title" value="Website visitors">
    <label>Chart type</label>
    <div class="seg" role="group" aria-label="Chart type">
      <button id="bar" aria-pressed="true">Bars</button>
      <button id="line" aria-pressed="false">Line</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="card">
    <div id="chart"></div>
    <div class="actions"><button class="btn primary" id="save">Save as image (SVG)</button></div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let type = "bar";
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function parse(text) {
    const rows = [], skipped = [];
    text.split(/\r?\n/).forEach((line, i) => {
      if (!line.trim()) return;
      const parts = line.includes("\t") ? line.split("\t") : line.split(/[,;]/);
      const label = (parts[0] || "").trim();
      const value = parseFloat(String(parts[1] || "").replace(/[^0-9.\-]/g, ""));
      if (label && Number.isFinite(value)) rows.push({ label, value }); else skipped.push(i + 1);
    });
    return { rows: rows.slice(0, 60), skipped };
  }

  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p) * p; }

  function render() {
    const { rows, skipped } = parse($("data").value);
    const header = skipped.length === 1 && skipped[0] === 1;
    $("msg").textContent = !rows.length ? "Add at least one row with a label and a number." : (skipped.length && !header ? "Skipped " + skipped.length + " row(s) without a number." : "");
    const W = 640, H = 400, m = { t: 48, r: 20, b: 64, l: 56 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const min = Math.min(0, ...rows.map((r) => r.value)), max = niceMax(Math.max(0, ...rows.map((r) => r.value)));
    const y = (v) => m.t + ih - ((v - min) / (max - min || 1)) * ih;
    const band = iw / Math.max(1, rows.length);
    let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + esc($("title").value) + '">';
    s += '<rect width="100%" height="100%" fill="#ffffff"/>';
    s += '<text x="' + m.l + '" y="28" font-size="18" font-weight="700" fill="#0f2234">' + esc($("title").value) + "</text>";
    for (let i = 0; i <= 4; i++) {
      const v = min + ((max - min) * i) / 4, yy = y(v);
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="#e3ebf2"/>';
      s += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" font-size="11" text-anchor="end" fill="#5b7186">' + esc(+v.toFixed(2)) + "</text>";
    }
    if (type === "bar") {
      rows.forEach((r, i) => {
        const x = m.l + i * band + band * 0.15, w = band * 0.7, y0 = y(Math.max(0, r.value)), h = Math.abs(y(r.value) - y(0));
        s += '<rect x="' + x + '" y="' + y0 + '" width="' + w + '" height="' + Math.max(1, h) + '" rx="4" fill="#0284c7"><title>' + esc(r.label + ": " + r.value) + "</title></rect>";
      });
    } else if (rows.length) {
      const pts = rows.map((r, i) => [m.l + i * band + band / 2, y(r.value)]);
      s += '<polyline fill="none" stroke="#0284c7" stroke-width="3" stroke-linejoin="round" points="' + pts.map((p) => p.join(",")).join(" ") + '"/>';
      pts.forEach((p, i) => (s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="#fff" stroke="#0284c7" stroke-width="2.5"><title>' + esc(rows[i].label + ": " + rows[i].value) + "</title></circle>"));
    }
    const every = Math.ceil(rows.length / 12);
    rows.forEach((r, i) => {
      if (i % every) return;
      const x = m.l + i * band + band / 2;
      s += '<text x="' + x + '" y="' + (H - m.b + 18) + '" font-size="11" text-anchor="middle" fill="#5b7186">' + esc(r.label.length > 12 ? r.label.slice(0, 11) + "…" : r.label) + "</text>";
    });
    s += "</svg>";
    $("chart").innerHTML = s;
    document.body.dataset.rows = String(rows.length);
  }

  ["data", "title"].forEach((id) => $(id).addEventListener("input", render));
  ["bar", "line"].forEach((t) => $(t).addEventListener("click", () => {
    type = t; $("bar").setAttribute("aria-pressed", t === "bar"); $("line").setAttribute("aria-pressed", t === "line"); render();
  }));
  $("save").addEventListener("click", () => {
    const blob = new Blob([$("chart").innerHTML], { type: "image/svg+xml" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "chart.svg";
    document.body.appendChild(a); a.click(); a.remove();
  });
  render();
})();
</script>
</body>
</html>
