<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tinkerspace — Explore</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFBFA;font-family:'Geist',system-ui,sans-serif;color:#1F2328}
a{color:#1F2328}a:hover{color:#1A7F37}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input{font-family:inherit}
.card{transition:border-color .15s ease,box-shadow .15s ease}
.card:hover{border-color:#C9C6BF;box-shadow:0 6px 20px rgba(31,35,40,.07)}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBFBFA">

<header style="max-width: 1120px; margin: 0 auto; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F2328">
<span style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background-color: #E47777">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>
</span>
<span style="font-weight: 650; font-size: 16px">Sandbox</span>
</a>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #D0CDC6; background: #FFFFFF; color: #1F2328; font-size: 14px; font-weight: 500; cursor: pointer">Sign in</button>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 0 24px 80px">

<section style="padding: 56px 0 48px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
<h1 style="margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: 1.1; font-weight: 500; letter-spacing: -0.025em; font-family: &quot;Geist Mono&quot;">Find Your Next Experiment</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #59636E; max-width: 520px">Pick a project and try it with your own files, right in your browser.</p>
<form style="margin-top: 12px; width: 100%; max-width: 560px">
<label for="q" class="sr">What do you want to do?</label>
<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border: 1px solid #D0CDC6; border-radius: 12px; background: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#59636E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="q" type="search" placeholder="What do you want to do?" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; font-size: 16px; color: #1F2328; background: transparent">
</div>
</form>
</section>

<section aria-labelledby="trending" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="trending" style="margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em">Trending</h2>
<div role="group" aria-label="Filter by type" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{c.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #1F2328; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-if>
<sc-if value="{{c.inactive}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{c.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #59636E; font-size: 13px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-if>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
<a href="Project.dc.html" class="card" style="display: flex; gap: 16px; align-items: flex-start; padding: 20px; background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 12px; text-decoration: none; color: #1F2328">
<span style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 10px; background: {{p.tint}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{p.isImages}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></sc-if>
<sc-if value="{{p.isAudio}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"></path></svg></sc-if>
<sc-if value="{{p.isText}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg></sc-if>
<sc-if value="{{p.isCreative}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"></path><circle cx="11" cy="11" r="2"></circle></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 14px; line-height: 1.45; color: #424A53">{{p.desc}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #59636E; margin-top: 4px">{{p.repo}}</span>
</span>
</a>
</sc-for>
</div>
</section>
</main>
</div>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"></helmet></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var f = (this.state && this.state.filter) || 'all';
    var self = this;
    var T = {
      images: { tint: '#E6F1EA', ink: '#1E5E37' },
      audio: { tint: '#F1EAFA', ink: '#5B2E86' },
      text: { tint: '#E7EEFA', ink: '#1D4E9E' },
      creative: { tint: '#FBE8EE', ink: '#912546' }
    };
    var raw = [
      { name: 'rembg', c: 'images', desc: 'Remove the background from any photo.', repo: 'danielgatis/rembg' },
      { name: 'Whisper', c: 'audio', desc: 'Turn a voice recording into text.', repo: 'openai/whisper' },
      { name: 'p5.js', c: 'creative', desc: 'Make moving drawings with a few lines.', repo: 'processing/p5.js' },
      { name: 'Tesseract', c: 'text', desc: 'Pull the words out of a photo of a page.', repo: 'tesseract-ocr/tesseract' },
      { name: 'Piper', c: 'audio', desc: 'Have any text read aloud.', repo: 'rhasspy/piper' },
      { name: 'Pandoc', c: 'text', desc: 'Convert a document to another format.', repo: 'jgm/pandoc' }
    ];
    var projects = raw.filter(function (p) { return f === 'all' || p.c === f; }).map(function (p) {
      var t = T[p.c];
      return { name: p.name, desc: p.desc, repo: p.repo, tint: t.tint, ink: t.ink,
        isImages: p.c === 'images', isAudio: p.c === 'audio', isText: p.c === 'text', isCreative: p.c === 'creative' };
    });
    var cats = [['all', 'All'], ['images', 'Images'], ['audio', 'Audio'], ['text', 'Documents'], ['creative', 'Creative']].map(function (c) {
      return { label: c[1], active: c[0] === f, inactive: c[0] !== f, pick: function () { self.setState({ filter: c[0] }); } };
    });
    return { projects: projects, cats: cats };
  }
}
</script>
</body>
</html>
